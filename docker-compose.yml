  #     - prometheus
  #   restart: always
    
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - accounts
    restart: always
  
  seq:
    image: datalust/seq:latest
    restart: always
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:5341"
      - "8081:80"

volumes:
  pgadmin:
  postgres-data:
  minio_data:
  elasticsearch-data:
  prometheus_data:
  grafana_data:
  redis_data:
  rabbitmq_data: