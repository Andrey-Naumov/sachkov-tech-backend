services:
  accounts:
    container_name: accounts
    build:
      context: ./AccountService
      dockerfile: ./src/AccountService.Api/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
        NUGET_PASSWORD: ${NUGET_PASSWORD}
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - minio
      - rabbitmq
      - seq
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ASPNETCORE_URLS=http://+:8001

  issues:
    container_name: issues
    build:
      context: ./IssueService
      dockerfile: ./src/SachkovTech.Web/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
        NUGET_PASSWORD: ${NUGET_PASSWORD}
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - minio
      - rabbitmq
      - seq
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ASPNETCORE_URLS=http://+:8002

  files:
    container_name: files
    build:
      context: ./FileService
      dockerfile: ./src/FileService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
        NUGET_PASSWORD: ${NUGET_PASSWORD}
    ports:
      - "8003:8003"
    depends_on:
      - minio
      - postgres
      - seq
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ASPNETCORE_URLS=http://+:8003

  tags:
    container_name: tags
    build:
      context: ./TagService
      dockerfile: ./src/TagService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
        NUGET_PASSWORD: ${NUGET_PASSWORD}
    ports:
      - "8004:8004"
    depends_on:
      - minio
      - postgres
      - seq
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ASPNETCORE_URLS=http://+:8004
