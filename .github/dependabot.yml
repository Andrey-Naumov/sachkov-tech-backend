version: 2

registries:
    nuget-example-custom:
      type: nuget-feed
      url: https://nuget.pkg.github.com/SachkovTech/index.json
      username: ${{ secrets.NUGET_USERNAME }}
      password: ${{ secrets.NUGET_PASSWORD }}

updates:
  - package-ecosystem: "dotnet-sdk"
    directories:
      - "/IssueService/"
      - "/AccountService/"
      - "/CommentService/"
      - "/EmailNotificationService/"
      - "/FaqService/"
      - "/FileService/"
      - "/KeyGen/"
      - "/NotificationService/"
      - "/ScheduleService/"
      - "/Shared/"
      - "/TagService/"
      - "/TelegramBotService/"
      - "/UserProgressService/"
      - "/tests/CodeAnalyzer.Tests/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Игнорируем все patch и minor обновления
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]

  - package-ecosystem: "nuget"
    registries: "*"
    directories:
        - "/IssueService/"
        - "/AccountService/"
        - "/CommentService/"
        - "/EmailNotificationService/"
        - "/FaqService/"
        - "/FileService/"
        - "/KeyGen/"
        - "/NotificationService/"
        - "/ScheduleService/"
        - "/Shared/"
        - "/TagService/"
        - "/TelegramBotService/"
        - "/UserProgressService/"
        - "/tests/CodeAnalyzer.Tests/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10    
    ignore:
      # Игнорируем все patch и minor обновления
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directories:
        - "/IssueService/src/SachkovTech.Web"
        - "/AccountService/src/AccountService.Api"
        - "/EmailNotificationService/EmailNotificationService.API"
        - "/FaqService/src/FaqService"
        - "/FileService/src/FileService"
        - "/NotificationService/src/NotificationService"
        - "/ScheduleService/"
        - "/TelegramBotService/src/TelegramBotService"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Игнорируем все patch и minor обновления для Docker образов
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
